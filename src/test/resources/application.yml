server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
app:
  jwt:
    secret: this-is-a-super-secret-jwt-key-for-testing-only-at-least-32-bytes
    expiration-ms: 3600000
  otp:
    secret: this-is-a-super-secret-otp-hash-key-for-testing-only-at-least-32-bytes
    expiration-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 30
    rate-limit-window-minutes: 15
    max-requests-per-window: 5
  frontend-url: http://localhost:5173
  mail:
    from: test@example.com
    api-key: test-key
