version: '3.8'

services:
  sams-db:
    image: postgres:16-alpine
    container_name: sams-db
    environment:
      POSTGRES_DB: sams_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - sams_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d sams_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  sams-backend:
    build: .
    container_name: sams-backend
    depends_on:
      sams-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://sams-db:5432/sams_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-bytes-long}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-no-reply@example.com}
    ports:
      - "8080:8080"

volumes:
  sams_db_data:
